<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEON</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #05050a;
            background-image: url('50521.png'); /* Aquí irá tu imagen de fondo del gato gamer */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background: rgba(10, 10, 20, 0.75);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            letter-spacing: 3px;
            color: #d1c4e9;
            text-shadow: 0 0 10px #7b1fa2, 0 0 20px #7b1fa2;
        }
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border-radius: 30px;
            border: 2px solid #7b1fa2;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            font-size: 1rem;
            outline: none;
            box-sizing: border-box;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e040fb;
            box-shadow: 0 0 15px #e040fb;
        }
        .shortcuts {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .shortcut-btn {
            background: rgba(123, 31, 162, 0.3);
            border: 1px solid #7b1fa2;
            padding: 10px 20px;
            border-radius: 10px;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }
        .shortcut-btn:hover {
            background: #7b1fa2;
            box-shadow: 0 0 10px #e040fb;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>NEON</h1>
        <input type="text" placeholder="Busca en la web o escribe una URL..." id="search-bar">
        
        <div class="shortcuts">
            <a href="https://discord.com" class="shortcut-btn">Discord</a>
            <a href="https://youtube.com" class="shortcut-btn">YouTube</a>
        </div>
    </div>

</body>
</html>
